version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - ineffassign
    - depguard
    - gomoddirectives
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - golang.org/x/
            - github.com/atotto/
            - github.com/aymanbagabas/
            - github.com/charmbracelet/
            - github.com/clipperhouse/
            - github.com/erikgeiser/
            - github.com/lucasb-eyer/
            - github.com/mattn/
            - github.com/muesli/
            - github.com/rivo/
            - github.com/xo/
            - gopkg.in/
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Println
        - fmt.Printf
    gosec:
      excludes:
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - text: "Error return value of .*.Close"
        linters:
          - errcheck
